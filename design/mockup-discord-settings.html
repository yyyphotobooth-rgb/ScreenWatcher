<div style="display: flex; gap: 10px">
<input id="s-token" type="password" value="xxxxxxxxxxxxxxxxxxxxxxxx" style="flex: 1; min-width: 0; height: 44px; box-sizing: border-box; padding: 0 12px; background: #15181d; color: #e8ebf0; border: 1px solid #3a4350; border-radius: 8px; font: inherit">
<button type="button" style="height: 44px; padding: 0 16px; background: #2b6fd6; color: #ffffff; border: 0; border-radius: 8px; font: inherit; font-weight: 500">เชื่อมต่อ</button>

<div style="color: #7db8ff; font-size: 13px">เชื่อมต่อแล้ว · บอทชื่อ "ยามเฝ้าเกม"</div>

<select id="s-room" style="height: 44px; padding: 0 12px; background: #15181d; color: #e8ebf0; border: 1px solid #3a4350; border-radius: 8px; font: inherit"><option>ห้องของ Palo › #แจ้งเตือนเกม</option></select>
<div style="display: flex; gap: 10px; align-items: center">

</div>
<div style="color: #aab3bf; font-size: 13px">พิมพ์ /ss ในห้องนั้น โปรแกรมจะส่งภาพจอเกมตอนนั้นกลับมา</div>
